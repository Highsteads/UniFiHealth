name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"   # matches Indigo 2025.2's embedded Python
      - name: Syntax check
        run: python -m compileall -q "UniFiHealth.indigoPlugin/Contents/Server Plugin"
      # This job has been named "tests" since it was created and until 08-09-2026 it
      # ran none — only compileall and ruff, while 17 tests sat in the bundle
      # never running on a push. The suite needs no third-party packages and no
      # Indigo: it stubs `indigo` at import.
      - name: Unit tests
        working-directory: "UniFiHealth.indigoPlugin/Contents/Server Plugin"
        run: python -m unittest discover -p "test_*.py" -q
      # The version-consistency guard lives at the repo root (outside the bundle),
      # so it needs pytest and a run from the repo root. Added 08-09-2026: it checks
      # the README header and changelog against Info.plist, the six required
      # Info.plist keys, and the CFBundleURLTypes shape Indigo actually accepts.
      - name: Version consistency
        run: |
          pip install pytest
          python -m pytest tests -q
      - name: Lint (ruff — errors only, see ruff.toml)
        run: |
          pip install ruff
          ruff check .
